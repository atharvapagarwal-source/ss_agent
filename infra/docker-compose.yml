# Docker Compose — full local dev stack.
# Services: FastAPI backend, Celery worker + beat, Redis, PostgreSQL, Carousel Renderer, Next.js web.
version: "3.9"

services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialcoach
      POSTGRES_USER: socialcoach
      POSTGRES_PASSWORD: socialcoach_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/seed.sql:/docker-entrypoint-initdb.d/01_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialcoach"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (broker + cache + pub/sub) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker (default + dm + analytics queues) ───────────────────────
  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - api
      - redis
      - postgres
    volumes:
      - ./apps/api:/app
    command: >
      celery -A workers.celery_app worker
        --queues=default,dm_queue,analytics_queue,research_queue
        --concurrency=4
        --loglevel=info

  # ── Celery beat (cron scheduler) ──────────────────────────────────────────
  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./apps/api:/app
    command: celery -A workers.beat_schedule beat --loglevel=info

  # ── Flower (Celery monitoring UI) ─────────────────────────────────────────
  flower:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A workers.celery_app flower --port=5555

  # ── Carousel renderer microservice ────────────────────────────────────────
  carousel_renderer:
    build:
      context: ./services/carousel-renderer
    ports:
      - "3001:3001"
    environment:
      PORT: 3001

  # ── Next.js frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    env_file: ./apps/web/.env.local
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
